# SPDX-License-Identifier: MIT OR Apache-2.0
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      - name: Scan history for secrets
        run: mise x gitleaks@8.30.1 -- gitleaks git --redact=100 --no-banner --log-opts=--all .
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Update Cabal package index
        run: cabal update
      - name: Build and lint
        run: 'mise run build ::: build:reference ::: lint'
      - name: Run fast tests
        run: cargo test --release --lib --bin cb --test enigma
      - name: Check CLI output
        run: |
          set -euo pipefail
          rust=$(./target/release/cb report data/ciphertext.txt --plain | awk '/^  cipher-break/{for (i = 1; i < NF; i++) if ($i == "IC") print $(i + 1)}')
          haskell=$(cd reference && cabal run -v0 cipher-break-reference -- analyze ../data/ciphertext.txt --null 1 | awk '/^IC /{print $2}')
          test "$rust" = "0.0438"
          test "$haskell" = "$rust"
