# SPDX-License-Identifier: MIT OR Apache-2.0
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install_args: github:Z3Prover/z3
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: proofs/lean
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
          leanchecker: 'true'
      - uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237
        with:
          kani-version: '0.68.0'
          command: cargo
          args: xtask prove --max-seconds 600
      - name: Verify scoped proof requirements and current hardware evidence
        run: cargo xtask prove --verify
      - name: Preserve proof receipts and isolated models
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-bound-proofs
          path: reports/proofs/
          if-no-files-found: error
          retention-days: 14
  check:
    needs: proofs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      - name: Scan history for secrets
        run: mise x gitleaks@8.30.1 -- gitleaks git --redact=100 --no-banner --log-opts=--all .
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Update Cabal package index
        run: cabal update
      - name: Build and lint
        run: 'mise run build ::: build:reference ::: lint'
      - name: Run fast tests
        run: cargo test --release --lib --bin cb --test enigma
      - name: Check CLI output
        run: mise x -- cargo xtask agree
