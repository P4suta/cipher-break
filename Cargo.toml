# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[package]
name = "cipher-break"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Classical cipher analysis with calibrated search results"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/P4suta/cipher-break"
keywords = ["cryptanalysis", "cipher", "vigenere", "classical", "cryptography"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "cb"
path = "src/main.rs"

[lib]
name = "cipher_break"
path = "src/lib.rs"

[dependencies]
pollster = { version = "0.4", optional = true }
rayon = "1.12"
wgpu = { version = "27", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster"]
